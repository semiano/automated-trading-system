providers:
  default_provider: "ccxt"
  ccxt:
    venue: "coinbase"
    rate_limit: true

symbols:
  - "HBAR/USD"
  - "XRP/USD"

timeframes:
  - "1m"
  - "5m"
  - "1h"

cache_horizon_days:
  "1m": 30
  "5m": 180
  "1h": 730
  "1d": 3650

ingestion:
  mode: "ws_trades"
  ws_rollup_timeframes:
    - "5m"
    - "1h"
  ws_reconnect_initial_backoff_seconds: 1
  ws_reconnect_max_backoff_seconds: 30
  warmup_bars: 800
  poll_delay_seconds: 20
  retries: 5
  backoff_seconds: 2
  allow_gap_jump_to_recent: true
  max_catchup_bars_per_cycle: 800
  gap_repair_enabled: true
  gap_repair_max_minutes: 240
  gap_repair_backoff_seconds: 5

indicators:
  bollinger:
    length: 20
    stdev: 2.0
  rsi:
    length: 14
  atr:
    length: 14
  ema_lengths:
    - 20
    - 50
    - 200
  volume_sma: 20
  vwap_mode: "rolling"

trading:
  enabled: true
  runtime_timeframe: "1m"
  sizing_mode: "fixed_notional"
  risk_per_trade_usd: 5.0
  max_position_notional_usd: null
  use_regime_filter: false
  htf_timeframe: "1h"
  regime_trend_ema_fast: 50
  regime_trend_ema_slow: 200
  chop_filter_mode: "bb_width"
  chop_bb_length: 20
  chop_bb_stdev: 2.0
  chop_bb_width_min: 0.006
  chop_atr_pct_min: 0.003
  bb_entry_mode: "off"
  bb_range_threshold_pct: 0.75
  momentum_swing_enabled: false
  momentum_pivot_left_bars: 2
  momentum_pivot_right_bars: 0
  momentum_lookback_bars: 10
  momentum_roc_length: 1
  momentum_min_roc: 0.0003
  min_entry_atr_pct: 0.08
  min_hold_bars_before_signal_exit: 5
  cooldown_bars_after_exit: 15
  cooldown_bars_after_stop: 10
  max_entries_per_hour: 4
  max_entries_per_day: 50
  timezone: "UTC"
  execution_adapter: "paper"
  live_trading_enabled: false
  live_allow_short: false
  live_max_order_notional_usd: 25.0
  live_allowed_symbols: []
  live_require_explicit_env_ack: true
  live_ack_env_var_name: "MDTAS_ENABLE_LIVE_TRADING"
  live_ack_env_var_value: "YES_I_ACKNOWLEDGE_LIVE_TRADING_RISK"
  position_size_usd: 100.0
  soft_portfolio_risk_limit_usd: 0.0
  risk_budget_policy: "per_symbol"
  portfolio_soft_risk_limit_usd: 0.0
  fee_bps: 0.0
  slippage_bps: 0.0
  tuned_params_path: "artifacts/xrp_tuned_engine_params_selected.yaml"
  default_constraints:
    min_notional_usd: 10.0
    qty_step: 0.0001
    price_tick: null
    fee_bps: 0.0
  per_asset_constraints:
    XRP/USD:
      min_notional_usd: 10.0
      qty_step: 0.1
      price_tick: 0.0001
      fee_bps: 0.0
  default_params:
    rsi_length: 14
    atr_length: 15
    ema_fast: 9
    ema_slow: 34
    rsi_entry: 40.0
    rsi_exit: 67.0
    stop_atr: 1.5
    take_profit_atr: 1.2
    max_hold_bars: 120
  per_asset_params:
    XRP/USD:
      rsi_length: 14
      atr_length: 15
      ema_fast: 9
      ema_slow: 34
      rsi_entry: 40
      rsi_exit: 67
      stop_atr: 1.5
      take_profit_atr: 1.2
      max_hold_bars: 120

